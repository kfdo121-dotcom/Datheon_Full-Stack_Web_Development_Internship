<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taskboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Taskboard</h1>
    <span id="count" aria-live="polite"></span>
  </header>

  <form id="add" class="card" autocomplete="off">
    <input id="title" class="field" placeholder="What needs doing?" aria-label="Task title" maxlength="140">
    <div class="row">
      <select id="cat" class="field" aria-label="Category">
        <option>Work</option><option>Personal</option><option>Study</option><option>Other</option>
      </select>
      <input id="due" class="field" type="date" aria-label="Due date">
      <button class="btn" type="submit">Add task</button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </form>

  <div class="controls">
    <div class="seg" id="status" role="group" aria-label="Filter by status">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="active" aria-pressed="false">Active</button>
      <button data-f="completed" aria-pressed="false">Completed</button>
    </div>
    <select id="cat-filter" class="field" aria-label="Filter by category">
      <option value="">All categories</option><option>Work</option><option>Personal</option><option>Study</option><option>Other</option>
    </select>
    <input id="search" class="field" type="search" placeholder="Search tasks" aria-label="Search tasks">
  </div>

  <ul id="list"></ul>

  <div class="foot">
    <span>Drag tasks to reorder. Double-click a title to edit.</span>
    <button id="clear">Clear completed</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
